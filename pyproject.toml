[project]
name = "just-tag-all-telegram-bot"
version = "0.1.0"
description = "Telegram bot for tagging and LLM features"
requires-python = ">=3.10"
dependencies = [
    "aiogram",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagallbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
